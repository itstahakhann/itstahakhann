name: Update profile visuals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate latest repositories card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_svg.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-repositories.svg
          git diff --cached --quiet || git commit -m "chore: update profile repository card"
          git push
